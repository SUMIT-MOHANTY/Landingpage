<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimized Landing Page</title>

    <!-- Critical CSS inlined for faster rendering -->
    <style>
        /* Critical path CSS */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            color: #333;
        }
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background-color: #f8f9fa;
        }
        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .hero p {
            font-size: 1.25rem;
            max-width: 600px;
            text-align: center;
        }
    </style>

    <!-- Preload key resources -->
    <link rel="preload" href="assets/css/styles.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="assets/css/styles.min.css"></noscript>

    <!-- Preconnect to required origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Defer non-critical JavaScript -->
    <script defer src="assets/js/main.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <!-- Navigation content -->
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Welcome to Our Site</h1>
            <p>A lightning-fast, optimized landing page experience</p>
            <img src="assets/images/placeholder.svg" alt="Hero image"
                 loading="eager" width="600" height="400">
        </section>

        <section class="features">
            <!-- Images with lazy loading -->
            <div class="feature">
                <img src="assets/images/feature1.svg" alt="Feature 1"
                     loading="lazy" width="300" height="200">
                <h2>Feature One</h2>
                <p>Description of feature one</p>
            </div>

            <div class="feature">
                <img src="assets/images/feature2.svg" alt="Feature 2"
                     loading="lazy" width="300" height="200">
                <h2>Feature Two</h2>
                <p>Description of feature two</p>
            </div>

            <div class="feature">
                <img src="assets/images/feature3.svg" alt="Feature 3"
                     loading="lazy" width="300" height="200">
                <h2>Feature Three</h2>
                <p>Description of feature three</p>
            </div>
        </section>
    </main>

    <footer>
        <!-- Footer content -->
    </footer>

    <!-- Analytics script with async to not block rendering -->
    <script async src="assets/js/analytics.min.js"></script>
</body>
</html>
